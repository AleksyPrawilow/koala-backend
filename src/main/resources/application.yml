spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/koala}
    username: ${DB_USER:koala_user}
    password: ${DB_PASSWORD:koala_password}

  jpa:
    open-in-view: false # Prevents lazy-loading queries from firing in the API layer
    hibernate:
      ddl-auto: validate # Let Flyway/Liquibase manage schema, Hibernate only validates
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: koala
  web:
    error:
      include-stacktrace: never
      include-message: always

app:
  security:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
    jwt:
      secret: ${JWT_SECRET_BASE64}
      expiration: ${JWT_EXPIRATION:15m}
      cookie-secure: ${JWT_COOKIE_SECURE:true}
      cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}