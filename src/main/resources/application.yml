spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/koala}
    username: ${DB_USER:koala_user}
    password: ${DB_PASSWORD:koala_password}

  jpa:
    open-in-view: false # Prevents lazy-loading queries from firing in the API layer
    hibernate:
      ddl-auto: validate # Let Flyway/Liquibase manage schema, Hibernate only validates
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  application:
    name: koala
  web:
    error:
      include-stacktrace: never
      include-message: always

koala:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@koala.local}